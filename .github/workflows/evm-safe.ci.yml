name: evm-safe > CI

on:
  push: &evm_safe_filters
    branches: [main]
    paths:
      # == Workspace configs ==
      - "**/*.just"
      - "**/justfile"
      - .prettierrc.js
      - biome.jsonc
      - bun.lock
      - bunfig.toml
      - package.json
      - tsconfig.json
      # == Package-specific ==
      - "evm/**" # workspace dependency, built before tests
      - "evm-safe/**"
      - "**/_base.ci.yml"
      - "**/evm-safe.*.yml"
  pull_request: *evm_safe_filters

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_base.ci.yml
    with:
      package-name: evm_safe
      setup-command: just build evm
    secrets:
      ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}
