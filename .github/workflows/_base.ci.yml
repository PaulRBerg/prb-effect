name: Base > CI

on:
  workflow_call:
    inputs:
      package-name:
        description: Name of the package
        required: true
        type: string
      setup-command:
        description: Optional command to run before tests (e.g., build a workspace dependency)
        required: false
        type: string
        default: ""
    secrets:
      ROUTEMESH_API_KEY:
        description: RouteMesh RPC API key used by integration tests (optional)
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sablier-labs/devkit/actions/setup@v1
        with:
          save-cache: true

      - name: Run setup command
        if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}

      - name: Run tests
        run: just ${{ inputs.package-name }}::test --run
        env:
          ROUTEMESH_API_KEY: ${{ secrets.ROUTEMESH_API_KEY }}

      - name: Add summary
        run: |
          echo "## CI result for ${{ inputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY
